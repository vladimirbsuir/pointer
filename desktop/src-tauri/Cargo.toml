[package]
name = "pointer"
version = "0.1.0"
description = "Pointer desktop client"
authors = ["Uladzimir Hanetski"]
edition = "2024"

[lib]
name = "pointer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
thiserror = "2.0.21"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
keyring = { version = "3", features = ["windows-native"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
