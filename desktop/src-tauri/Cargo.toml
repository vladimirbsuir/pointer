[workspace]
members = ["crates/pointer-executor", "crates/pointer-runner"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread", "process"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
sha2 = "0.11.1"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
ignore = "0.4.34"
globset = "0.4.21"
regex = "1.13.1"
similar = "3.2.1"
html2text = "0.17.4"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.25.0"
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "pointer"
version = "0.1.0"
description = "Pointer desktop client"
authors = ["Uladzimir Hanetski"]
edition = "2024"

[lib]
name = "pointer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pointer-executor = { path = "crates/pointer-executor" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = "0.23.1"
rand = "0.10.3"
thiserror = "2.0.21"
url = { workspace = true }
reqwest = { workspace = true }
keyring = { version = "3", features = ["windows-native"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
tree-sitter = { workspace = true }

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = { workspace = true }
