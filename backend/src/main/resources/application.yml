spring:
  application:
    name: pointer-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POINTER_DB_URL:jdbc:postgresql://localhost:5432/pointer}
    username: ${POINTER_DB_USER:pointer}
    password: ${POINTER_DB_PASSWORD:pointer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      file: ../infra/docker-compose.yml
      lifecycle-management: start-only

server:
  port: ${POINTER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pointer:
  encryption-key: ${POINTER_ENCRYPTION_KEY:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTAxMjM0NTY3ODk=}
  auth:
    jwt-secret: ${POINTER_JWT_SECRET:local-development-secret-not-for-production-use}
    issuer: ${POINTER_JWT_ISSUER:pointer}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    allowed-origins: ${POINTER_ALLOWED_ORIGINS:http://localhost:1420,http://tauri.localhost,tauri://localhost}
  gateway:
    allow-query-token: ${POINTER_GATEWAY_ALLOW_QUERY_TOKEN:false}
  github:
    client-id: ${POINTER_GITHUB_CLIENT_ID:}
    client-secret: ${POINTER_GITHUB_CLIENT_SECRET:}
    authorize-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    api-url: https://api.github.com
  container:
    enabled: ${POINTER_CONTAINER_ENABLED:false}
    docker-host: ${POINTER_DOCKER_HOST:}
    image: ${POINTER_RUNNER_IMAGE:pointer-runner:latest}
    api-url: ${POINTER_RUNNER_API_URL:http://host.docker.internal:8080}
    network: ${POINTER_RUNNER_NETWORK:}
    cpus: 2
    memory: 4GB
    pids-limit: 512
    idle-timeout: 30m
    prepare-timeout: 10m
    github-api-url: ${pointer.github.api-url}
  telegram:
    bot-token: ${POINTER_TELEGRAM_BOT_TOKEN:}
    api-url: ${POINTER_TELEGRAM_API_URL:https://api.telegram.org}
    poll-timeout: 30s
    link-code-ttl: 10m

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
