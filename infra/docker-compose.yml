name: pointer

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: pointer
      POSTGRES_USER: pointer
      POSTGRES_PASSWORD: pointer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointer -d pointer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
