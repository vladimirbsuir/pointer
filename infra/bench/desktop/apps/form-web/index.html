<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>form-web</title>
<style>
  body { margin: 0; font: 16px "DejaVu Sans", sans-serif; background: #ffffff; }
  #list { list-style: none; margin: 24px; padding: 0; width: 320px; }
  #list li { height: 56px; margin-bottom: 12px; color: #ffffff; display: flex; align-items: center; padding-left: 16px; cursor: grab; }
  #list li[data-id="A"] { background: #ff0000; }
  #list li[data-id="B"] { background: #00ff00; color: #000000; }
  #list li[data-id="C"] { background: #0000ff; }
  #list li[data-id="D"] { background: #ff00ff; }
  #text { margin: 0 24px; font-size: 18px; width: 320px; height: 40px; border: none; background: #ffff00; }
  #signup { margin: 24px; width: 320px; display: grid; gap: 8px; }
  #signup input { font-size: 16px; height: 32px; }
  #signup button { font-size: 16px; height: 36px; width: 120px; }
  #error { color: #b00020; min-height: 20px; font-size: 14px; }
  dialog { font-size: 16px; }
</style>
</head>
<body>
<ul id="list">
  <li draggable="true" data-id="A">A</li>
  <li draggable="true" data-id="B">B</li>
  <li draggable="true" data-id="C">C</li>
  <li draggable="true" data-id="D">D</li>
</ul>
<input id="text" type="text" autocomplete="off">
<form id="signup" novalidate>
  <label for="username">Username</label>
  <input id="username" type="text" autocomplete="off">
  <label for="email">Email</label>
  <input id="email" type="text" autocomplete="off">
  <div id="error" role="alert"></div>
  <button id="register" type="submit">Register</button>
</form>
<dialog id="done">
  <p id="done-text"></p>
  <button id="close" type="button">Close</button>
</dialog>
<script>
  const list = document.getElementById("list");
  const text = document.getElementById("text");
  const signup = document.getElementById("signup");
  const username = document.getElementById("username");
  const email = document.getElementById("email");
  const error = document.getElementById("error");
  const done = document.getElementById("done");
  const users = [];
  let dragged = null;

  function report() {
    const order = [...list.children].map((item) => item.dataset.id).join("");
    document.title = "form-web " + JSON.stringify({ order, text: text.value, users, dialog: done.open });
  }

  function problem(name, address) {
    if (!name) {
      return "Enter a username.";
    }
    if (/\s/.test(name)) {
      return "Usernames cannot contain spaces. Use a dash instead.";
    }
    if (!/^[A-Za-z0-9-]+$/.test(name)) {
      return "Use only letters, digits and dashes.";
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(address)) {
      return "Enter a valid email address.";
    }
    return "";
  }

  signup.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = username.value.trim();
    const message = problem(name, email.value.trim());
    error.textContent = message;
    if (message) {
      report();
      return;
    }
    users.push(name);
    username.value = "";
    email.value = "";
    document.getElementById("done-text").textContent = "Registered " + name + ".";
    done.showModal();
    report();
  });
  document.getElementById("close").addEventListener("click", () => {
    done.close();
    report();
  });
  done.addEventListener("close", report);

  list.addEventListener("dragstart", (event) => {
    dragged = event.target;
    event.dataTransfer.setData("text/plain", dragged.dataset.id);
  });
  list.addEventListener("dragover", (event) => event.preventDefault());
  list.addEventListener("drop", (event) => {
    event.preventDefault();
    const target = event.target.closest("li");
    if (!dragged || !target || target === dragged) {
      return;
    }
    const after = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
    list.insertBefore(dragged, after ? target.nextSibling : target);
    dragged = null;
    report();
  });
  text.addEventListener("input", report);
  report();
</script>
</body>
</html>
