[package]
name = "pointer-bench-device"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pointer-executor = { path = "../../../desktop/src-tauri/crates/pointer-executor" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
